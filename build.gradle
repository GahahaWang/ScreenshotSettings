plugins {
    id 'fabric-loom' version "${fabric_loom}"
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.3.0'
}

version = project.mod_version + '-' + project.minecraft_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    // Cloth Config
    maven {
        name 'Shedaniel'
        url "https://maven.shedaniel.me/"
    }
    // Mod Menu
    maven { url "https://maven.terraformersmc.com/releases/" }
    // YetAnotherConfigLib
    maven { url = "https://maven.isxander.dev/releases" }

}

dependencies {
    // To change the versions see the gradle.yml.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // cloth config for serializing/deserializing config data
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config}"
    // Mod Menu
    modImplementation "com.terraformersmc:modmenu:${project.modmenu}"
    // YetAnotherConfigLib
    modImplementation "dev.isxander:yet-another-config-lib:${project.yacl}"
    // Iris Shaders integration
    modImplementation "maven.modrinth:iris:${project.iris}"
    modImplementation "maven.modrinth:sodium:${project.sodium}"
    // templating library for file naming system
    shadow(implementation('org.antlr:ST4:4.3.4'))

}
processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
        "minecraft_version": project.minecraft_version,
        "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier.set("dev")
    relocate "org.antlr", "com.quantumgarbage.screenshotsettings.shadow.org.antlr"
}
remapJar {
    dependsOn(shadowJar)
    inputFile = tasks.shadowJar.archiveFile
}
jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
